<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yukio AI - ChatGPT Clone</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; background:#212121; color:#ececec; display:flex; height:100vh; }
#sidebar { width:260px; background:#171717; padding:16px; display:flex; flex-direction:column; border-right:1px solid #2f2f2f; }
#main { flex:1; display:flex; flex-direction:column; }
.logo { font-size:20px; font-weight:700; margin-bottom:8px; }
.sub { font-size:12px; color:#888; margin-bottom:20px; }
.newchat { width:100%; padding:12px; background:#212121; color:white; border:1px solid #3f3f3f; border-radius:8px; cursor:pointer; }
.newchat:hover { background:#2f2f2f; }
#chat { flex:1; overflow-y:auto; padding:20px; }
.msg { max-width:750px; margin:0 auto 24px auto; display:flex; gap:16px; line-height:1.7; font-size:15px; }
.avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; flex-shrink:0; }
.user .avatar { background:#fff; color:#000; }
.ai .avatar { background:#4a90e2; color:white; }
.bubble { flex:1; white-space:pre-wrap; word-break:break-word; }
.bubble pre { background:#2f2f2f; padding:12px; border-radius:8px; margin:10px 0; overflow-x:auto; }
#inputArea { padding:20px; display:flex; justify-content:center; background:#212121; }
#inputWrap { width:100%; max-width:750px; display:flex; align-items:center; background:#2f2f2f; border-radius:24px; padding:6px 6px 6px 20px; }
#inp { flex:1; background:transparent; border:none; color:white; outline:none; font-size:15px; padding:8px 0; }
#btn { background:white; color:black; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:18px; font-weight:bold; }
#btn:disabled { opacity:0.5; }
.footer { text-align:center; font-size:11px; color:#666; padding:0 0 12px 0; }
@media(max-width:700px){ #sidebar{display:none} }
</style>
</head>
<body>

<div id="sidebar">
  <div class="logo">Yukio AI</div>
  <div class="sub">Clone ChatGPT • TokenJuice</div>
  <button class="newchat" onclick="location.reload()">+ New Chat</button>
  <div style="margin-top:auto; font-size:11px; color:#555;">
    Powered by<br>DeepSeek V3 + TokenJuice
  </div>
</div>

<div id="main">
  <div id="chat">
    <div class="msg ai">
      <div class="avatar">Y</div>
      <div class="bubble"><b>Yukio AI</b><br><br>Halo bos! Gue Yukio AI 🤖<br><br>Gue bisa:<br>✅ Bikin coding Python, HTML, Discord Bot<br>✅ Fix error code<br>✅ Jawab pertanyaan kayak ChatGPT<br><br>Gas tanya apa aja di bawah!</div>
    </div>
  </div>
  
  <div id="inputArea">
    <div id="inputWrap">
      <input id="inp" placeholder="Tanya apa aja ke Yukio AI..." autocomplete="off">
      <button id="btn">↑</button>
    </div>
  </div>
  <div class="footer">Yukio AI bisa salah. Cek info penting ya bos.</div>
</div>

<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const ava = role === 'user' ? 'U' : 'Y';
  // Format code block simple
  let formatted = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/```python([\s\S]*?)```/g, '<pre>$1</pre>')
    .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
    .replace(/\n/g, '<br>');
  div.innerHTML = `<div class="avatar">${ava}</div><div class="bubble">${role==='user' ? '' : '<b>'+ (role==='user'?'You':'Yukio AI') +'</b><br><br>'}${formatted}</div>`;
  if(role==='user') div.querySelector('.bubble').innerHTML = text.replace(/</g,"&lt;");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const t = inp.value.trim();
  if(!t) return;
  addMsg('user', t);
  inp.value = '';
  btn.disabled = true;
  btn.innerText = '...';
  try {
    const r = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:t})
    });
    const d = await r.json();
    addMsg('ai', d.reply);
  } catch(e) {
    addMsg('ai', 'Error koneksi bos: ' + e);
  }
  btn.disabled = false;
  btn.innerText = '↑';
  inp.focus();
}

btn.onclick = send;
inp.addEventListener('keypress', e => { if(e.key==='Enter') send(); });
</script>

</body>
</html>
